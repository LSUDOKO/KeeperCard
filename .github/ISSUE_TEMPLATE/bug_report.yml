name: Bug report
description: Something behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the bug could move funds or let a payment record be falsified, please report it
        privately instead: [security advisory](https://github.com/LSUDOKO/KeeperCard/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts (PaymentAnchor)
        - engine (delegations, spend, KeeperHub execution)
        - server (REST API, MCP tools, OAuth)
        - dashboard
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, requests, or the MCP tool call. Include the card/charge id if there is one.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Error output, and any on-chain hashes involved (payment tx, receipt anchor tx) and the KeeperHub execution id.
        Never paste a private key or a card secret.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.18.0, or the commit SHA"
  - type: checkboxes
    id: keeperhub
    attributes:
      label: KeeperHub
      options:
        - label: "`KEEPERHUB_API_KEY` was set and the workflows were provisioned (`keeperhub:provision`)"
        - label: "`bun run --cwd packages/server keeperhub:doctor` passes"
