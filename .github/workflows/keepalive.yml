name: Keep API awake

# Render's free tier sleeps the API after ~15 minutes idle; the next request then pays a
# cold Docker boot (image start + Bun + KeeperHub handshake), which has been observed to
# take up to ~90s and is long enough to break Privy's embedded-wallet onboarding (it gives
# up and reports a NetworkError). This ping keeps the instance warm.
#
# GitHub's free-tier cron scheduler is best-effort and can slip by minutes-to-hours under
# platform load, so every-5-minutes is used (not 10) to leave slack under Render's 15-minute
# idle window, and --max-time is generous enough to not false-fail on a real cold boot.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: curl the API health endpoint
        run: |
          set -e
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 120 https://attestpay-api.onrender.com/health)
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::API health check returned $code"
            exit 1
          fi
