[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Required, not optional: PaymentAnchored carries nine fields, which exhausts the legacy
# codegen's addressable stack slots ("Stack too deep"). The IR pipeline is the
# documented remedy.
via_ir = true

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

# Formatting is enforced in CI (`forge fmt --check`), so the sources are normalised to
# these settings once rather than left at whatever width each was authored to.
[fmt]
line_length = 120
tab_width = 4
