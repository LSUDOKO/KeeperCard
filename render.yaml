# Render blueprint for the KeeperCard API server.
#
# Docker, not a native runtime: the server uses bun:sqlite and Bun.serve.
services:
  - type: web
    # NOTE: the service is named keepercard-api, but Render keeps the hostname a service
    # was CREATED with, so its public URL remains attestpay-api.onrender.com. Renaming does
    # not move the domain; only a new service (or a custom domain) would change the host.
    name: keepercard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      # SQLite path. On the free plan this is ephemeral — see the disk note below.
      - key: ATTESTPAY_DB_PATH
        value: /data/attestpay.sqlite
      # Settlement chain. 8453 = Base mainnet (real USDC); 84532 = Base Sepolia, whose
      # USDC comes from a free faucet. MUST match the dashboard's build-time
      # NEXT_PUBLIC_ATTESTPAY_CHAIN_ID — a signed delegation carries the chain id, so a
      # mismatch produces signatures the relayer cannot redeem.
      - key: ATTESTPAY_CHAIN_ID
        value: "84532"
      # Browser origins allowed on /api/* and /shop/*: the Cloudflare Worker that
      # serves the dashboard (docs/deployment-cloudflare.md). Comma-separated, exact match.
      - key: ATTESTPAY_CORS_ORIGINS
        value: https://keepercard-dashboard.adoranto737.workers.dev
      # This service's own public origin. Without it, cardUrl() (mcp/server.ts) and the
      # OAuth issuer/resource metadata (oauth/routes.ts) fall back to
      # http://localhost:<PORT> — every minted card MCP URL is then unreachable from
      # outside this container, which is exactly what an agent hitting one sees.
      - key: ATTESTPAY_PUBLIC_MCP_BASE
        value: https://attestpay-api.onrender.com
      # --- KeeperHub: the execution layer -------------------------------------
      # Without KEEPERHUB_API_KEY the server FAILS LOUDLY on every payment rather than
      # silently no-op'ing; ATTESTPAY_EXECUTOR=1shot is the rollback lane.
      # Workflow ids are not set here: the server resolves every workflow BY NAME at boot
      # (created by `bun run --cwd packages/server keeperhub:provision`, which is
      # idempotent). KEEPERHUB_WORKFLOW_<KEY> exists only as an optional pin.
      - key: KEEPERHUB_WALLET_ADDRESS
        value: "0x4F719186a5545B8dB9a8e3e2F31eDdfc55BaD441"
      # Refuse to execute a payment that was not dry-run first. This is the whole point;
      # leave it on.
      - key: KEEPERHUB_DRY_RUN_REQUIRED
        value: "1"
      # On-chain receipts: every confirmed payment gets a PaymentAnchor.anchorPayment
      # record, written by KeeperHub on the same chain the payment settled on (Base Sepolia).
      - key: KEEPERHUB_RECEIPT_ANCHOR_ADDRESS
        value: "0x56733223c688cce7fc65826b692b3f8521e4ab3e"
      # The dry run refuses a payment when Chainlink USDC/USD reads below this floor.
      - key: KEEPERHUB_DEPEG_FLOOR
        value: "0.98"

      # Secrets: set in the Render dashboard, never committed.
      - key: KEEPERHUB_API_KEY
        sync: false
      - key: ATTESTPAY_MASTER_KEY
        sync: false
      - key: ATTESTPAY_ADMIN_TOKEN
        sync: false
      # Pays for the one-time EIP-7702 upgrade of a fresh account; needs a little native
      # gas on the settlement chain.
      - key: ATTESTPAY_7702_SPONSOR_PK
        sync: false
      - key: ATTESTPAY_PRIVY_APP_ID
        sync: false

# NOTE ON PERSISTENCE
# The free plan has no persistent disk, so /data resets on every deploy and on the
# instance sleeping. That loses cards, delegations and the payment history. For anything
# beyond a demo, attach a disk (paid plan):
#
#   disk:
#     name: keepercard-data
#     mountPath: /data
#     sizeGB: 1
